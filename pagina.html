<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Lossless</title>
<style>
:root{--bg:#f6f6f8;--card:#fff;--tx:#1d1d1f;--mut:#6e6e73;--bd:#e3e3e8;--ac:#fa2d48;--ok:#1f9d55;--warn:#c77700;--chip:#f0f0f3}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1e1e21;--tx:#f2f2f4;--mut:#9a9aa1;--bd:#333338;--ac:#ff4d66;--ok:#3ecf7a;--warn:#f0a030;--chip:#2a2a2e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:26px;margin:0 0 4px}
h2{font-size:18px;margin:0 0 10px}
.topo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sub{color:var(--mut);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px}
.linha{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font:inherit;border:0;border-radius:9px;padding:8px 14px;background:var(--ac);color:#fff;cursor:pointer;font-weight:600}
button.sec{background:var(--chip);color:var(--tx)}
button:disabled{opacity:.45;cursor:default}
.idioma{display:flex;border:1px solid var(--bd);border-radius:9px;overflow:hidden;flex:none}
.idioma button{border-radius:0;background:transparent;color:var(--mut);padding:5px 10px;font-weight:600;font-size:12px}
.idioma button.on{background:var(--tx);color:var(--bg)}
input[type=text],select{font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
input[type=text]{min-width:220px}
label.campo{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
.ok{color:var(--ok);font-weight:600}.mut{color:var(--mut)}.warn{color:var(--warn)}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--chip);font-size:12px;margin:0 4px 2px 0;white-space:nowrap}
.chip.atmos{background:#1b1b1f;color:#fff}.chip.ll{background:#e8f0ff;color:#1a4fb5}
@media (prefers-color-scheme:dark){.chip.atmos{background:#fff;color:#000}.chip.ll{background:#1c2b4a;color:#9cc0ff}}
.chip.alta{background:#e3f6ea;color:#17703c}.chip.média{background:#fff3dc;color:#8a5300}.chip.baixa{background:#fde7e7;color:#a3262b}
@media (prefers-color-scheme:dark){.chip.alta{background:#173524;color:#7fe0a5}.chip.média{background:#3b2c10;color:#f3c26b}.chip.baixa{background:#3d1a1b;color:#ff9a9e}}
.item{display:grid;grid-template-columns:24px 56px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--bd);align-items:start}
.item img{width:56px;height:56px;border-radius:6px;background:var(--chip);object-fit:cover}
.item .t{font-weight:600}
.item details{margin-top:4px;color:var(--mut);font-size:13px}
.item details li{margin:1px 0}
.feito{opacity:.5}
#log{font:12px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;max-height:220px;overflow:auto;background:var(--chip);border-radius:8px;padding:10px;margin-top:10px}
progress{width:100%;height:8px}
.barra{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:12px 16px;margin:0 -18px -18px;border-radius:0 0 14px 14px}
a{color:var(--ac)}
.tabs button{background:var(--chip);color:var(--tx)}.tabs button.on{background:var(--tx);color:var(--bg)}
.esc{display:none}
</style>
</head>
<body>
<main>
  <div class="topo">
    <h1>Music Lossless</h1>
    <div class="idioma" role="group" aria-label="Idioma / Language">
      <button id="lang-pt" onclick="mudarIdioma('pt')">PT</button>
      <button id="lang-en" onclick="mudarIdioma('en')">EN</button>
    </div>
  </div>
  <p class="sub"><span data-i="intro"></span> <span id="pastaBackup"></span>.</p>

  <section class="card" id="cConfig">
    <h2 data-i="cfgTitulo"></h2>
    <div id="cfgOk" class="esc"><span class="ok" data-i="cfgOk"></span> <button class="sec" onclick="mostrarCfg()" data-i="cfgTrocar"></button></div>
    <div id="cfgForm">
      <p class="mut" data-i="cfgAjuda" data-html></p>
      <div class="linha">
        <label class="campo">Team ID<input type="text" id="team" placeholder="ABCDE12345" style="min-width:140px"></label>
        <label class="campo">Key ID<input type="text" id="kid" placeholder="XYZ987654" style="min-width:140px"></label>
        <label class="campo" style="flex:1"><span data-i="cfgCaminho"></span><input type="text" id="kpath" placeholder="~/Downloads/AuthKey_XYZ987654.p8"></label>
        <button onclick="salvarCfg()" style="align-self:flex-end" data-i="salvar"></button>
      </div>
    </div>
  </section>

  <section class="card" id="cLogin">
    <h2>2. Apple Music</h2>
    <div class="linha"><span id="loginTxt" class="mut"></span><button id="bLogin" onclick="entrar()"></button></div>
  </section>

  <section class="card">
    <h2 data-i="andamento"></h2>
    <div id="tarefaTxt" class="mut"></div>
    <progress id="prog" value="0" max="1" class="esc"></progress>
    <div id="log" class="esc"></div>
  </section>

  <section class="card">
    <h2 data-i="bkTitulo"></h2>
    <p class="mut" id="bkInfo" style="margin:0 0 10px"></p>
    <div class="linha"><button class="sec" id="bApagarBk" onclick="apagarBackup()" data-i="bkBotao"></button><span id="bkAviso" class="mut"></span></div>
  </section>

  <section class="card">
    <div class="linha tabs" style="margin-bottom:12px">
      <button id="tabT" class="on" onclick="aba('T')" data-i="abaTrocar"></button>
      <button id="tabR" onclick="aba('R')" data-i="abaRepetidas"></button>
    </div>

    <div id="painelT">
      <div class="linha">
        <button id="bAnalisar" onclick="analisar()" data-i="analisar"></button>
        <span id="analiseTxt" class="mut"></span>
      </div>
      <div id="filtros" class="linha esc" style="margin-top:14px">
        <select id="fTipo" onchange="desenhar()">
          <option value="" data-i="fTudo"></option>
          <option value="trocar" data-i="fTrocar"></option>
          <option value="atmos" data-i="fAtmos"></option>
        </select>
        <select id="fConf" onchange="desenhar()">
          <option value="" data-i="fConf"></option><option value="alta" data-i="conf_alta"></option><option value="média" data-i="conf_média"></option><option value="baixa" data-i="conf_baixa"></option>
        </select>
        <select id="fVar" onchange="desenhar()">
          <option value="" data-i="fFormato"></option><option value="dolby-atmos" data-i="fComAtmos"></option><option value="hi-res-lossless">Hi-Res Lossless</option>
        </select>
        <input type="text" id="fBusca" data-i-ph="fBusca" oninput="desenhar()">
        <label class="linha mut"><input type="checkbox" id="fFeitos" onchange="desenhar()"> <span data-i="fFeitos"></span></label>
      </div>
      <div id="lista"></div>
      <div id="mais" class="esc" style="text-align:center;padding:12px"><button class="sec" onclick="limite+=200;desenhar()" data-i="mais"></button></div>
      <details id="naoAchados" class="esc" style="margin-top:14px"><summary></summary><ul id="naoLista" class="mut"></ul></details>
      <div class="barra esc" id="barraT"><div class="linha">
        <button class="sec" onclick="marcarVisiveis(true)" data-i="marcarVis"></button>
        <button class="sec" onclick="marcarVisiveis(false)" data-i="desmarcarVis"></button>
        <span id="selTxt" class="mut" style="flex:1"></span>
        <button id="bAplicar" onclick="aplicar()" data-i="aplicar"></button>
      </div></div>
    </div>

    <div id="painelR" class="esc">
      <div class="linha"><button onclick="carregarRepetidas()" data-i="procurarRep"></button><span id="repTxt" class="mut"></span></div>
      <div id="repLista"></div>
      <div class="barra esc" id="barraR"><div class="linha">
        <span id="repSel" class="mut" style="flex:1"></span>
        <button id="bRep" onclick="aplicarRepetidas()" data-i="removerRep"></button>
      </div></div>
    </div>
  </section>
</main>
<script>
const TXT={
pt:{
  intro:'Troca as faixas antigas da biblioteca do app Música pelas versões Lossless / Dolby Atmos do catálogo e remove repetidas. Antes de apagar qualquer arquivo seu, ele é baixado e copiado para',
  cfgTitulo:'1. Chave MusicKit', cfgOk:'✓ Chave configurada.', cfgTrocar:'Trocar chave',
  cfgAjuda:'No <a href="https://developer.apple.com/account/resources/identifiers/list" target="_blank" rel="noopener">portal de desenvolvedor</a>, crie um <b>Media ID</b> (Identifiers › + › Media IDs, com MusicKit). Depois, em <a href="https://developer.apple.com/account/resources/authkeys/list" target="_blank" rel="noopener">Keys</a>, crie uma chave com <b>Media Services (MusicKit)</b> ligada a esse Media ID e baixe o arquivo .p8.',
  cfgCaminho:'Caminho do .p8', salvar:'Salvar',
  naoConectado:'Ainda não conectado.', conectado:'✓ Conectado', loja:'loja', entrar:'Entrar no Apple Music', entrarDeNovo:'Entrar de novo',
  andamento:'Andamento', nada:'Nada em andamento.',
  bkTitulo:'Backup das versões antigas', bkVazio:'Nenhum backup no momento.', bkBotao:'Mover backup para o Lixo',
  bkInfo:(n,tam,p)=>`${n} arquivos (${tam}) em ${p}. São as suas faixas que foram trocadas ou removidas como repetidas.`,
  bkRodando:'Disponível quando a tarefa em andamento terminar.',
  bkPendentes:n=>`Disponível quando as ${n} músicas pendentes chegarem do iCloud.`,
  bkConfirma:(n,tam)=>`Mover ${n} arquivos (${tam}) para o Lixo?\n\nPara as faixas enviadas que foram trocadas, esta é a única cópia do seu arquivo original. Elas ficam no Lixo até você esvaziá-lo.`,
  pendentesNuvem:n=>`${n} músicas trocadas aguardando o iCloud trazer a versão nova. Reproduções e playlists são acertadas sozinhas quando chegarem; deixe esta página aberta.`, servidorParado:'Servidor parado. Rode “python3 musica.py” de novo.',
  abaTrocar:'Trocar por Lossless / Atmos', abaRepetidas:'Repetidas', analisar:'Analisar biblioteca',
  analisarDeNovo:'Analisar de novo? (o que já foi trocado fica registrado)',
  analiseAntiga:'Esta análise foi feita por uma versão anterior, que identificava as faixas de um jeito que não é seguro. Clique em Analisar biblioteca de novo (é rápido: o catálogo já está em cache).',
  resumo:(d,nT,nA,nf)=>`Análise de ${d}: ${nT} álbuns para trocar, ${nA} com edição em Atmos, ${nf} faixas.`,
  falhas:n=>` ⚠︎ ${n} álbuns falharam na consulta; clique em Analisar de novo para tentar só esses.`,
  naoAchados:n=>`${n} álbuns sem equivalente no catálogo (ficam como estão)`, faixasN:n=>`${n} faixas`,
  fTudo:'Tudo', fTrocar:'Enviadas / correspondidas / indisponíveis', fAtmos:'Apple Music → edição com Atmos',
  fConf:'Qualquer confiança', conf_alta:'alta', 'conf_média':'média', conf_baixa:'baixa', confianca:c=>`confiança ${c}`,
  fFormato:'Qualquer formato', fComAtmos:'Com Dolby Atmos', fBusca:'Buscar artista ou álbum', fFeitos:'mostrar já trocados',
  mais:'Mostrar mais', marcarVis:'Marcar visíveis', desmarcarVis:'Desmarcar visíveis', aplicar:'Aplicar',
  semAtmos:'versão atual sem Atmos', faixasDe:(a,b)=>`${a}/${b} faixas`, abrir:'abrir', trocado:'✓ trocado', faixas:'faixas',
  semPar:'Sem par no catálogo (ficam como estão): ', pendentes:'Pendentes da última tentativa: ', vazio:'Nada com esses filtros.',
  selecao:(a,f)=>`${a} álbuns marcados · ${f} faixas`,
  confirmar:(a,nf,p,b)=>`Trocar ${a} álbuns (${nf} faixas)?\n\n• As versões do catálogo entram na biblioteca.\n• Reproduções, notas e favoritos passam para elas. Nas playlists, a nova entra no fim e a antiga sai.\n• Algumas chegam do iCloud minutos depois; a troca se completa sozinha.\n• ${p} faixas que são arquivos seus serão baixadas e copiadas para\n  ${b}\n  antes de sair da biblioteca.\n• Depois disso as antigas são apagadas da biblioteca (e do iCloud).`,
  procurarRep:'Procurar repetidas', lendo:'Lendo a biblioteca…', removerRep:'Remover repetidas marcadas',
  repResumo:(g,e)=>`${g} músicas repetidas (${e} cópias sobrando). Mesmo nome, artista e álbum, com duração até 3 s de diferença.`,
  fica:'fica', sai:'sai', repSel:(g,c)=>`${g} marcadas · ${c} cópias saem`,
  confirmarRep:(n,b)=>`Remover ${n} cópias repetidas?\n\nFica a de melhor qualidade; reproduções e playlists passam para ela. Cópias que são arquivos seus são baixadas e copiadas para ${b} antes de sair.`,
  st:{uploaded:'Enviado',matched:'Correspondido','no longer available':'Indisponível',subscription:'Apple Music',purchased:'Comprado',unknown:'Desconhecido'},
  mkErro:'Não consegui carregar o MusicKit JS.', locale:'pt-BR'
},
en:{
  intro:'Swaps old tracks in your Music library for the Lossless / Dolby Atmos versions from the catalog, and removes duplicates. Before any file of yours is deleted, it is downloaded and copied to',
  cfgTitulo:'1. MusicKit key', cfgOk:'✓ Key configured.', cfgTrocar:'Change key',
  cfgAjuda:'In the <a href="https://developer.apple.com/account/resources/identifiers/list" target="_blank" rel="noopener">developer portal</a>, create a <b>Media ID</b> (Identifiers › + › Media IDs, with MusicKit). Then, in <a href="https://developer.apple.com/account/resources/authkeys/list" target="_blank" rel="noopener">Keys</a>, create a key with <b>Media Services (MusicKit)</b> linked to that Media ID and download the .p8 file.',
  cfgCaminho:'Path to the .p8', salvar:'Save',
  naoConectado:'Not connected yet.', conectado:'✓ Connected', loja:'storefront', entrar:'Sign in to Apple Music', entrarDeNovo:'Sign in again',
  andamento:'Progress', nada:'Nothing running.',
  bkTitulo:'Old versions backup', bkVazio:'No backup at the moment.', bkBotao:'Move backup to Trash',
  bkInfo:(n,tam,p)=>`${n} files (${tam}) in ${p}. These are your own tracks that were swapped or removed as duplicates.`,
  bkRodando:'Available when the running task finishes.',
  bkPendentes:n=>`Available once the ${n} pending songs arrive from iCloud.`,
  bkConfirma:(n,tam)=>`Move ${n} files (${tam}) to the Trash?\n\nFor uploaded tracks that were swapped, this is the only copy of your original file. They stay in the Trash until you empty it.`,
  pendentesNuvem:n=>`${n} swapped songs waiting for iCloud to deliver the new version. Play counts and playlists are fixed automatically when they arrive; keep this page open.`, servidorParado:'Server stopped. Run “python3 musica.py” again.',
  abaTrocar:'Swap for Lossless / Atmos', abaRepetidas:'Duplicates', analisar:'Analyze library',
  analisarDeNovo:'Analyze again? (what was already swapped stays recorded)',
  analiseAntiga:'This analysis was made by an older version that identified tracks in an unsafe way. Click Analyze library again (it is quick: the catalog is already cached).',
  resumo:(d,nT,nA,nf)=>`Analysis from ${d}: ${nT} albums to swap, ${nA} with a Dolby Atmos edition, ${nf} tracks.`,
  falhas:n=>` ⚠︎ ${n} albums failed to look up; click Analyze library again to retry just those.`,
  naoAchados:n=>`${n} albums with no catalog match (left as they are)`, faixasN:n=>`${n} tracks`,
  fTudo:'Everything', fTrocar:'Uploaded / matched / unavailable', fAtmos:'Apple Music → Dolby Atmos edition',
  fConf:'Any confidence', conf_alta:'high', 'conf_média':'medium', conf_baixa:'low', confianca:c=>`${c} confidence`,
  fFormato:'Any format', fComAtmos:'With Dolby Atmos', fBusca:'Search artist or album', fFeitos:'show already swapped',
  mais:'Show more', marcarVis:'Select visible', desmarcarVis:'Deselect visible', aplicar:'Apply',
  semAtmos:'current version has no Atmos', faixasDe:(a,b)=>`${a}/${b} tracks`, abrir:'open', trocado:'✓ swapped', faixas:'tracks',
  semPar:'No catalog match (left as they are): ', pendentes:'Pending from the last attempt: ', vazio:'Nothing matches these filters.',
  selecao:(a,f)=>`${a} albums selected · ${f} tracks`,
  confirmar:(a,nf,p,b)=>`Swap ${a} albums (${nf} tracks)?\n\n• The catalog versions are added to your library.\n• Play counts, ratings and favorites move to them. In playlists, the new one is added at the end and the old one removed.\n• Some arrive from iCloud minutes later; the swap completes itself.\n• ${p} tracks that are your own files will be downloaded and copied to\n  ${b}\n  before leaving the library.\n• Then the old ones are deleted from the library (and from iCloud).`,
  procurarRep:'Find duplicates', lendo:'Reading the library…', removerRep:'Remove selected duplicates',
  repResumo:(g,e)=>`${g} duplicated songs (${e} extra copies). Same title, artist and album, with lengths within 3 s.`,
  fica:'keep', sai:'remove', repSel:(g,c)=>`${g} selected · ${c} copies removed`,
  confirmarRep:(n,b)=>`Remove ${n} duplicate copies?\n\nThe best-quality copy stays; play counts and playlists move to it. Copies that are your own files are downloaded and copied to ${b} before they go.`,
  st:{uploaded:'Uploaded',matched:'Matched','no longer available':'No Longer Available',subscription:'Apple Music',purchased:'Purchased',unknown:'Unknown'},
  mkErro:'Could not load MusicKit JS.', locale:'en-US'
}};
const VAR={'dolby-atmos':['Dolby Atmos','atmos'],'hi-res-lossless':['Hi-Res Lossless','ll'],'lossless':['Lossless','ll']};
const H={'Content-Type':'application/json','X-Troca':'1'};
let L=(()=>{try{const s=localStorage.getItem('idioma');if(s)return s}catch(e){}return (navigator.language||'').toLowerCase().startsWith('pt')?'pt':'en'})();
let E={}, A=null, sel=new Set(), limite=200, R=null, rsel=new Set(), rodavaAntes=false;
const t=k=>TXT[L][k];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vis=(el,v)=>el.classList.toggle('esc',!v);
async function api(p,body){
  const r=await fetch(p,body===undefined?{}:{method:'POST',headers:H,body:JSON.stringify(body)});
  const j=await r.json(); if(!r.ok) throw new Error(j.erro||('HTTP '+r.status)); return j;
}
function erro(e){alert(e.message||e)}

function aplicarIdioma(){
  document.documentElement.lang=L==='pt'?'pt-BR':'en';
  $('lang-pt').classList.toggle('on',L==='pt'); $('lang-en').classList.toggle('on',L==='en');
  document.querySelectorAll('[data-i]').forEach(el=>{const v=t(el.dataset.i); if(el.hasAttribute('data-html')) el.innerHTML=v; else el.textContent=v;});
  document.querySelectorAll('[data-i-ph]').forEach(el=>el.placeholder=t(el.dataset.iPh));
}
async function mudarIdioma(l){
  L=l; try{localStorage.setItem('idioma',l)}catch(e){}
  aplicarIdioma();
  try{await api('/api/idioma',{idioma:l})}catch(e){}
  await atualizar(); if(A) carregarAnalise(true); if(R) desenharRepetidas(); desenharBackup();
}

async function atualizar(){
  try{E=await api('/api/estado')}catch(e){$('tarefaTxt').textContent=t('servidorParado');return}
  if(E.idioma&&E.idioma!==L){api('/api/idioma',{idioma:L}).catch(()=>{})}
  $('pastaBackup').textContent=E.backup;
  vis($('cfgOk'),E.configurado); vis($('cfgForm'),!E.configurado);
  if(E.config){$('team').value||=E.config.team_id||'';$('kid').value||=E.config.key_id||'';$('kpath').value||=E.config.key_path||''}
  $('bLogin').disabled=!E.configurado;
  $('loginTxt').innerHTML=E.logado?`<span class="ok">${t('conectado')}</span> <span class="mut">(${t('loja')}: ${esc(E.storefront)})</span>`:esc(t('naoConectado'));
  $('bLogin').textContent=E.logado?t('entrarDeNovo'):t('entrar');
  const tf=E.tarefa;
  $('bAnalisar').disabled=tf.rodando||!E.logado; $('bAplicar').disabled=tf.rodando; $('bRep').disabled=tf.rodando;
  if(tf.nome){
    $('tarefaTxt').innerHTML=(tf.rodando?'⏳ ':tf.erro?'<span class="warn">⚠︎</span> ':'<span class="ok">✓</span> ')+esc(tf.nome+': '+(tf.etapa||''))+(tf.total?` — ${tf.feito}/${tf.total}`:'');
    vis($('prog'),tf.rodando&&tf.total>0); $('prog').max=tf.total||1; $('prog').value=tf.feito;
    vis($('log'),true); const l=$('log'); const fim=l.scrollTop+l.clientHeight>=l.scrollHeight-8; l.textContent=tf.log.join('\n'); if(fim) l.scrollTop=l.scrollHeight;
  } else $('tarefaTxt').textContent=t('nada');
  if(E.pendentes) $('tarefaTxt').insertAdjacentHTML('beforeend',`<div class="warn" style="margin-top:6px">⏳ ${esc(t('pendentesNuvem')(E.pendentes))}</div>`);
  if(rodavaAntes&&!tf.rodando){ carregarAnalise(); if(R) carregarRepetidas(); carregarBackup(); }
  desenharBackup();
  rodavaAntes=tf.rodando;
  if(!A&&E.temAnalise) carregarAnalise();
}
aplicarIdioma(); api('/api/idioma',{idioma:L}).catch(()=>{}).finally(atualizar); setInterval(atualizar,1500); carregarBackup();

// ── backup
let BK=null;
async function carregarBackup(){ try{BK=await api('/api/backup')}catch(e){return} desenharBackup(); }
const fmtTam=b=>b>=1e9?(b/1e9).toFixed(1).replace('.',L==='pt'?',':'.')+' GB':Math.round(b/1e6)+' MB';
function desenharBackup(){
  if(!BK) return;
  $('bkInfo').textContent=BK.arquivos?t('bkInfo')(BK.arquivos,fmtTam(BK.bytes),BK.pastas.join(', ')):t('bkVazio');
  const bloqueio=E.tarefa&&E.tarefa.rodando?t('bkRodando'):(E.pendentes?t('bkPendentes')(E.pendentes):'');
  $('bApagarBk').disabled=!BK.arquivos||!!bloqueio; $('bkAviso').textContent=BK.arquivos?bloqueio:'';
}
async function apagarBackup(){
  if(!confirm(t('bkConfirma')(BK.arquivos,fmtTam(BK.bytes)))) return;
  try{await api('/api/backup/apagar',{}); await carregarBackup(); await atualizar();}catch(e){erro(e)}
}

function mostrarCfg(){vis($('cfgForm'),true);vis($('cfgOk'),false)}
async function salvarCfg(){
  try{await api('/api/config',{team_id:$('team').value,key_id:$('kid').value,key_path:$('kpath').value});await atualizar()}catch(e){erro(e)}
}
function carregarMusicKit(){
  return new Promise((ok,falha)=>{
    if(window.MusicKit) return ok();
    document.addEventListener('musickitloaded',()=>ok(),{once:true});
    const s=document.createElement('script'); s.src='https://js-cdn.music.apple.com/musickit/v3/musickit.js'; s.onerror=()=>falha(new Error(t('mkErro')));
    document.head.appendChild(s);
  });
}
async function entrar(){
  try{
    await carregarMusicKit();
    const mk=await MusicKit.configure({developerToken:E.devToken,app:{name:'Music Lossless',build:'1.0'}});
    const tok=await mk.authorize();
    await api('/api/login',{token:tok}); await atualizar();
  }catch(e){erro(e)}
}
function aba(x){
  $('tabT').classList.toggle('on',x==='T'); $('tabR').classList.toggle('on',x==='R');
  vis($('painelT'),x==='T'); vis($('painelR'),x==='R');
  if(x==='R'&&!R) carregarRepetidas();
}

// ── troca pelo catálogo / catalog swap
async function analisar(){
  if(A&&A.itens&&!confirm(t('analisarDeNovo'))) return;
  try{await api('/api/analisar',{});await atualizar()}catch(e){erro(e)}
}
async function carregarAnalise(manterSelecao){
  if(!manterSelecao||!A) A=await api('/api/analise');
  if(!A.itens) return;
  if(A.versao!==2){ $('analiseTxt').innerHTML=`<span class="warn">${esc(t('analiseAntiga'))}</span>`; vis($('filtros'),false); vis($('barraT'),false); $('lista').innerHTML=''; return; }
  if(!manterSelecao) sel=new Set(A.itens.filter(i=>!i.feito&&i.conf==='alta').map(i=>i.id));
  const nT=A.itens.filter(i=>i.tipo==='trocar').length, nA=A.itens.length-nT;
  const nf=A.itens.reduce((s,i)=>s+i.faixas.length,0);
  $('analiseTxt').textContent=t('resumo')(new Date(A.quando).toLocaleString(t('locale')),nT,nA,nf)+(A.falhas?t('falhas')(A.falhas):'');
  vis($('filtros'),true); vis($('barraT'),true);
  const na=A.naoAchados||[]; vis($('naoAchados'),na.length>0);
  $('naoAchados').querySelector('summary').textContent=t('naoAchados')(na.length);
  $('naoLista').innerHTML=na.slice(0,2000).map(i=>`<li>${esc(i.artista)} — ${esc(i.album)} <span class="chip">${t('faixasN')(i.nFaixas)}</span></li>`).join('');
  desenhar();
}
const semAcento=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function filtrados(){
  const tipo=$('fTipo').value, conf=$('fConf').value, v=$('fVar').value, b=semAcento($('fBusca').value), f=$('fFeitos').checked;
  return A.itens.filter(i=>(!tipo||i.tipo===tipo)&&(!conf||i.conf===conf)&&(!v||i.catalogo.variants.includes(v))&&(f||!i.feito)
    &&(!b||semAcento(i.artista+' '+i.album+' '+i.catalogo.nome).includes(b)));
}
function chipsVar(vs){
  const out=[]; if(vs.includes('dolby-atmos')) out.push(VAR['dolby-atmos']);
  if(vs.includes('hi-res-lossless')) out.push(VAR['hi-res-lossless']); else if(vs.includes('lossless')) out.push(VAR['lossless']);
  return out.map(([x,c])=>`<span class="chip ${c}">${x}</span>`).join('');
}
const st=k=>t('st')[k]||k;
function desenhar(){
  if(!A||!A.itens) return;
  const fs=filtrados();
  $('lista').innerHTML=fs.slice(0,limite).map(i=>{
    const c=i.catalogo, chips=Object.entries(i.status).map(([k,n])=>`<span class="chip">${st(k)} ${n}</span>`).join('');
    const faixas=i.faixas.map(f=>`<li>${esc(f.nome)} <span class="chip">${st(f.status)}</span> → ${esc(f.novoNome)}</li>`).join('');
    const sem=i.semPar.length?`<li class="warn">${t('semPar')}${i.semPar.map(esc).join(', ')}</li>`:'';
    const pend=(i.pendentes||[]).length?`<div class="warn">${t('pendentes')}${i.pendentes.map(esc).join(', ')}</div>`:'';
    return `<div class="item ${i.feito?'feito':''}">
      <input type="checkbox" ${sel.has(i.id)?'checked':''} ${i.feito?'disabled':''} onchange="marcar('${i.id}',this.checked)">
      <img loading="lazy" src="${esc(c.arte)}" alt="">
      <div>
        <div class="t">${esc(i.artista)} — ${esc(i.album)}</div>
        <div>${chips}<span class="mut">${i.tipo==='atmos'?t('semAtmos'):''}</span></div>
        <div style="margin-top:4px">→ <b>${esc(c.nome)}</b> <span class="mut">${esc(c.artista)} · ${esc(c.ano)}</span> ${chipsVar(c.variants)}
          <span class="chip ${i.conf}">${t('confianca')(t('conf_'+i.conf))}</span> <span class="mut">${t('faixasDe')(i.faixas.length,i.nFaixas)}</span>
          ${c.url?`· <a href="${esc(c.url)}" target="_blank" rel="noopener">${t('abrir')}</a>`:''} ${i.feito?`<span class="ok">${t('trocado')}</span>`:''}</div>
        ${pend}
        <details><summary>${t('faixas')}</summary><ul>${faixas}${sem}</ul></details>
      </div></div>`;
  }).join('')||`<p class="mut">${t('vazio')}</p>`;
  vis($('mais'),fs.length>limite);
  contarSel();
}
function marcar(id,v){v?sel.add(id):sel.delete(id);contarSel()}
function marcarVisiveis(v){filtrados().forEach(i=>{if(!i.feito)(v?sel.add(i.id):sel.delete(i.id))});desenhar()}
function contarSel(){
  const its=A.itens.filter(i=>sel.has(i.id)&&!i.feito);
  $('selTxt').textContent=t('selecao')(its.length,its.reduce((s,i)=>s+i.faixas.length,0));
  $('bAplicar').disabled=!its.length||(E.tarefa&&E.tarefa.rodando);
}
async function aplicar(){
  const its=A.itens.filter(i=>sel.has(i.id)&&!i.feito); const nf=its.reduce((s,i)=>s+i.faixas.length,0);
  const proprias=its.reduce((s,i)=>s+i.faixas.filter(f=>['uploaded','matched','unknown'].includes(f.status)).length,0);
  if(!confirm(t('confirmar')(its.length,nf,proprias,E.backup))) return;
  try{await api('/api/aplicar',{ids:its.map(i=>i.id)});await atualizar()}catch(e){erro(e)}
}

// ── repetidas / duplicates
async function carregarRepetidas(){
  $('repTxt').textContent=t('lendo');
  try{R=await api('/api/repetidas')}catch(e){$('repTxt').textContent='';return erro(e)}
  rsel=new Set(R.grupos.map(g=>g.id));
  desenharRepetidas();
}
function desenharRepetidas(){
  const extras=R.grupos.reduce((s,g)=>s+g.remover.length,0);
  $('repTxt').textContent=t('repResumo')(R.grupos.length,extras);
  const fmt=x=>`<span class="chip">${st(x.cloudStatus)} · ${x.bitRate||'?'} kbps${x.playedCount?' · '+x.playedCount+'×':''}</span>`;
  $('repLista').innerHTML=R.grupos.map(g=>`<div class="item" style="grid-template-columns:24px 1fr">
    <input type="checkbox" ${rsel.has(g.id)?'checked':''} onchange="this.checked?rsel.add('${g.id}'):rsel.delete('${g.id}');contarRep()">
    <div><div class="t">${esc(g.nome)}</div><div class="mut">${esc(g.artista)} — ${esc(g.album)}</div>
    <div style="margin-top:4px"><span class="ok">${t('fica')}</span> ${fmt(g.manter)} &nbsp; <span class="warn">${t('sai')}</span> ${g.remover.map(fmt).join('')}</div></div></div>`).join('');
  vis($('barraR'),R.grupos.length>0); contarRep();
}
function contarRep(){
  const gs=R.grupos.filter(g=>rsel.has(g.id));
  $('repSel').textContent=t('repSel')(gs.length,gs.reduce((s,g)=>s+g.remover.length,0));
}
async function aplicarRepetidas(){
  const gs=R.grupos.filter(g=>rsel.has(g.id)); const n=gs.reduce((s,g)=>s+g.remover.length,0);
  if(!confirm(t('confirmarRep')(n,E.backup))) return;
  try{await api('/api/repetidas',{ids:gs.map(g=>g.id)});await atualizar()}catch(e){erro(e)}
}
</script>
</body>
